name: Decompile rg32tw3ka.dtb to DTS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompile-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Device Tree Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler

      - name: Decompile DTB to DTS
        run: |
          if [ ! -f "rg32tw3ka.dtb" ]; then
            echo "::error::Die Datei rg32tw3ka.dtb wurde im Hauptverzeichnis nicht gefunden!"
            exit 1
          fi
          
          echo "Dekomprimiere rg32tw3ka.dtb zu rg32tw3ka.dts..."
          dtc -I dtb -O dts -o rg32tw3ka.dts rg32tw3ka.dtb

      - name: Commit and Push DTS File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add rg32tw3ka.dts
          
          if git status --porcelain | grep -q "rg32tw3ka.dts"; then
            git commit -m "auto: rg32tw3ka.dtb erfolgreich zu DTS dekompiliert [skip ci]"
            git push origin main
            echo "Die rg32tw3ka.dts wurde erfolgreich in dein Repository hochgeladen!"
          else
            echo "Keine Änderungen an der DTS-Datei festgestellt."
          fi
