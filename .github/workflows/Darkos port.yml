name: DarkOS4Clone M9 Pro Multi-Part Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag bei lcdyk0517/arkos4clone'
        required: false
        default: '20260808'

permissions:
  contents: write

jobs:
  build-m9pro-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler kpartx p7zip-full mtools e2tools curl wget jq file

      - name: Step 1 - Build M9 Pro DTB
        run: |
          echo "=== STEP 1: DTB Erstellung ==="
          if [ -f "rg32tw3ka.dts" ]; then
            echo "Gefunden: rg32tw3ka.dts -> Kompiliere..."
            dtc -I dts -O dtb -o m9pro_patched.dtb rg32tw3ka.dts
          elif [ -f "rg32tw3ka.dtb" ]; then
            echo "Gefunden: rg32tw3ka.dtb -> Kopiere..."
            cp rg32tw3ka.dtb m9pro_patched.dtb
          else
            echo "::error::Weder rg32tw3ka.dts noch rg32tw3ka.dtb im Root-Verzeichnis gefunden!"
            exit 1
          fi

          if [ ! -s "m9pro_patched.dtb" ]; then
            echo "::error::Die erstellte m9pro_patched.dtb ist leer!"
            exit 1
          fi
          echo "DTB erfolgreich erstellt: $(du -h m9pro_patched.dtb | cut -f1)"

      - name: Step 2 - Download All Parts from Release Tag
        run: |
          echo "=== STEP 2: Download aller Release-Parts ==="
          mkdir -p download_parts
          cd download_parts

          TAG="${{ github.event.inputs.release_tag }}"
          echo "Lade Assets für Tag '$TAG' aus lcdyk0517/arkos4clone..."

          # Abfrage der Release-Assets via GitHub API für das angegebene Tag
          RELEASE_JSON=$(curl -s -H "Accept: application/vnd.github+json" "https://api.github.com/repos/lcdyk0517/arkos4clone/releases/tags/$TAG")

          # Falls Tag nicht gefunden wird, Fallback auf latest Release
          if echo "$RELEASE_JSON" | grep -q "Not Found"; then
            echo "Tag $TAG nicht gefunden, wähle latest Release..."
            RELEASE_JSON=$(curl -s -H "Accept: application/vnd.github+json" https://api.github.com/repos/lcdyk0517/arkos4clone/releases/latest)
          fi

          # Extrahiere alle Download-Links der vorhandenen Archive/Parts
          URLS=$(echo "$RELEASE_JSON" | jq -r '.assets[]?.browser_download_url')

          if [ -z "$URLS" ] || [ "$URLS" == "null" ]; then
            echo "::error::Keine Download-Assets im Release $TAG gefunden!"
            exit 1
          fi

          echo "Gefundene Parts:"
          echo "$URLS"

          # Alle Part-Dateien herunterladen
          for url in $URLS; do
            echo "Lade Part herunter: $url"
            wget --continue --progress=dot:giga "$url"
          done

          echo "Download abgeschlossen. Heruntergeladene Dateien:"
          ls -lh

      - name: Step 3 - Extract Multi-Part Archive
        run: |
          echo "=== STEP 3: Zusammenfügen & Entpacken der Parts ==="
          mkdir -p workdir

          # Suche nach der ersten Part-Datei (.001, .part1.rar, .zip.001 etc.)
          FIRST_PART=$(ls download_parts/*.001 download_parts/*.part1.rar download_parts/*.part01.rar 2>/dev/null | head -n 1 || true)

          # Fallback: Falls es sich um ein einzelnes Archiv handelt
          if [ -z "$FIRST_PART" ]; then
            FIRST_PART=$(ls download_parts/*.7z download_parts/*.zip download_parts/*.rar 2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$FIRST_PART" ]; then
            echo "::error::Keine entpackbare Archiv-Datei in download_parts gefunden!"
            exit 1
          fi

          echo "Entpacke Multi-Part Archiv über Haupt-Part: $FIRST_PART"
          7z x "$FIRST_PART" -oworkdir/ -y

          # Suche nach der daraus hervorgehenden .img-Datei
          IMG_FILE=$(find workdir/ -name "*.img" | head -n 1)

          if [ -z "$IMG_FILE" ]; then
            echo "::error::Keine .img Datei im entpackten Archiv gefunden!"
            exit 1
          fi

          echo "Gefundenes Image: $IMG_FILE"
          mv "$IMG_FILE" workdir/darkos_m9pro.img
          echo "Gesamtgröße des entpackten Images: $(du -h workdir/darkos_m9pro.img | cut -f1)"

      - name: Step 4 - Mount & Patch M9 Pro DTB
        run: |
          echo "=== STEP 4: Injiziere M9 Pro DTB in Boot-Partition ==="
          cd workdir

          sudo kpartx -av darkos_m9pro.img
          sleep 2

          LOOP_BOOT=$(ls /dev/mapper/loop*p1 | head -n 1)
          if [ -z "$LOOP_BOOT" ]; then
            echo "::error::Konnte Loop-Partitionen nicht ermitteln!"
            exit 1
          fi

          echo "Boot-Partition gemountet unter: $LOOP_BOOT"
          mkdir -p mnt_boot
          sudo mount "$LOOP_BOOT" mnt_boot

          echo "Kopiere M9 Pro DTB..."
          sudo cp ../m9pro_patched.dtb mnt_boot/rg32tw3ka.dtb
          sudo cp ../m9pro_patched.dtb mnt_boot/rk3326-r36s-linux.dtb || true
          sudo cp ../m9pro_patched.dtb mnt_boot/rk3326-rg351p-linux.dtb || true

          # boot.ini anpassen
          if [ -f "mnt_boot/boot.ini" ]; then
            echo "Passe boot.ini an..."
            sudo sed -i 's/dtb_name=.*/dtb_name=rg32tw3ka.dtb/' mnt_boot/boot.ini || true
            sudo sed -i 's/rk3326-r36s-linux.dtb/rg32tw3ka.dtb/g' mnt_boot/boot.ini || true
          fi

          # extlinux.conf anpassen
          if [ -f "mnt_boot/extlinux/extlinux.conf" ]; then
            echo "Passe extlinux.conf an..."
            sudo sed -i 's/rk3326-r36s-linux.dtb/rg32tw3ka.dtb/g' mnt_boot/extlinux/extlinux.conf || true
            sudo sed -i 's/fdt .*/fdt \/rg32tw3ka.dtb/g' mnt_boot/extlinux/extlinux.conf || true
          fi

          sync
          sudo umount mnt_boot
          
          LOOP_DEV=$(echo "$LOOP_BOOT" | sed -E 's/p1$//; s|^/dev/mapper/||')
          sudo kpartx -d "/dev/$LOOP_DEV" || sudo kpartx -d darkos_m9pro.img || true
          echo "Boot-Partition erfolgreich gepatcht!"

      - name: Step 5 - Compress & Package Output
        run: |
          echo "=== STEP 5: Komprimiere fertiges M9 Pro Image ==="
          cd workdir
          7z a -t7z -m0=lzma2 -mx=1 DarkOS_M9Pro_Patched.7z darkos_m9pro.img
          echo "Fertiges Archiv: $(du -h DarkOS_M9Pro_Patched.7z | cut -f1)"

      - name: Step 6 - Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarkOS_M9Pro_Patched_Image
          path: workdir/DarkOS_M9Pro_Patched.7z
          retention-days: 7
